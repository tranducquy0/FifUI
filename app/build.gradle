plugins {
    id "com.android.application"
}

android {
    namespace "dev.rmx3834.circularbattery"
    compileSdk 35

    defaultConfig {
        applicationId "dev.rmx3834.circularbattery"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2.0"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly "de.robv.android.xposed:api:82"
}
